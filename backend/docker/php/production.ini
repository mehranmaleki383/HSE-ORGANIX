expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

upload_max_filesize = 50M
post_max_size = 55M

date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
